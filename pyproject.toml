[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "locbench"
version = "0.2.15"
description = "Locator testing / parameter tuning on purely synthetic data (bench layer over aelib)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "matplotlib>=3.5",
    # not on PyPI: install aelib first (pip install -e E:\GitHub_codes\aelib)
    "aelib>=0.9.34",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
test = ["pytest>=7"]

[project.scripts]
locbench = "locbench.app:main"

[tool.setuptools.packages.find]
include = ["locbench*"]
