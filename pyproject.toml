[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "locbench"
version = "0.2.28"
description = "Locator testing / parameter tuning on purely synthetic data (bench layer over aelib)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "streamlit>=1.66",
    # 前提依赖：aelib 为私有库、不经 pip 分发——安装 locbench 的环境
    # 必须已装有 aelib（已装时本条直接满足；缺失时安装以"找不到
    # aelib"停止，提示先装 aelib）
    "aelib>=0.9.44",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
locbench = "locbench.app:main"

[tool.setuptools.packages.find]
include = ["locbench*"]
