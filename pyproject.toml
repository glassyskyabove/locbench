[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "locbench"
version = "0.2.18"
description = "Locator testing / parameter tuning on purely synthetic data (bench layer over aelib)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "matplotlib>=3.5",
    "streamlit>=1.66",
    # aelib 不在 PyPI 上：从 GitHub 直接拉取。aelib 仓库当前为私有，
    # 匿名安装前需先公开它，或先自行安装 aelib（pip install -e 路径）
    "aelib @ git+https://github.com/glassyskyabove/aelib.git",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
locbench = "locbench.app:main"

[tool.setuptools.packages.find]
include = ["locbench*"]
